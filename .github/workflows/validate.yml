name: Validate build configurations
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      include_vte:
        description: Also validate optional GTK 2 and GTK 3 terminals
        type: boolean
        default: false
jobs:
  configurations:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        env:
          INCLUDE_VTE: ${{ inputs.include_vte || false }}
        run: |
          python3 - <<'PY'
          import json, os
          vtes = [0, 1] if os.environ['INCLUDE_VTE'] == 'true' else [0]
          matrix = {'include': [{'gtk': gtk, 'vte': vte, 'command': command}
                    for gtk in (2, 3) for vte in vtes for command in (0, 1)]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('value=' + json.dumps(matrix) + '\n')
          PY
  build:
    needs: configurations
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configurations.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install matching dependencies
        run: |
          packages="libgtk2.0-dev"
          if [ '${{ matrix.gtk }}' = 3 ]; then packages="libgtk-3-dev"; fi
          if [ '${{ matrix.vte }}' = 1 ]; then
            if [ '${{ matrix.gtk }}' = 2 ]; then packages="$packages libvte-dev";
            else packages="$packages libvte-2.91-dev"; fi
          fi
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libmagic-dev libx11-dev xvfb xauth dbus-x11 fonts-dejavu-core procps htop zsh fish $packages
      - name: Build and validate
        env:
          TEST_GTK: ${{ matrix.gtk }}
          TEST_VTE: ${{ matrix.vte }}
          TEST_COMMAND: ${{ matrix.command }}
        run: tests/run-build-configuration.sh
      - name: Upload optional validation binary (never a release)
        if: matrix.vte == 1
        uses: actions/upload-artifact@v4
        with:
          name: validation-only-gtk${{ matrix.gtk }}-vte-command${{ matrix.command }}
          path: emelfm2
